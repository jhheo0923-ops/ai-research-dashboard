name: Update data and deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 7 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Collect sources and rebuild dashboard
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python dashboard.py update

      - name: Run tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python -m unittest discover -s tests -v

      - name: Save refreshed public data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_research.db data/dashboard.json web/data.js
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh AI research dashboard"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
